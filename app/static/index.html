<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频帧序列导出</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
  --text: #e6e8ec; --muted: #9aa3b2; --accent: #4f8cff; --accent2: #2f6fe0;
  --green: #34c759; --red: #ff5a5a; --radius: 10px;
}
body { background: var(--bg); color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.5; }
header { padding: 18px 28px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; background: var(--panel); }
header h1 { font-size: 18px; font-weight: 600; }
header .tag { font-size: 12px; color: var(--muted);
  border: 1px solid var(--border); padding: 2px 8px; border-radius: 20px; }
main { max-width: 1280px; margin: 0 auto; padding: 24px; display: grid;
  grid-template-columns: 1fr 1fr; gap: 20px; }
.card { background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; }
.card h2 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
.drop { border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 36px 20px; text-align: center; color: var(--muted); cursor: pointer;
  transition: border-color .2s, background .2s; }
.drop:hover, .drop.over { border-color: var(--accent);
  background: rgba(79,140,255,.06); color: var(--text); }
.drop .file-name { color: var(--accent); margin-top: 8px; word-break: break-all; }
label.field { display: block; margin-bottom: 10px; }
label.field span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
input[type=number], input[type=text], select {
  width: 100%; background: var(--panel2); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted);
  background: var(--panel2); padding: 8px 10px; border-radius: 6px;
  border: 1px solid var(--border); cursor: pointer; font-size: 13px; }
.toggle input { accent-color: var(--accent); }
.toggle.on { color: var(--text); border-color: var(--accent); }
button.primary { width: 100%; margin-top: 14px; background: var(--accent);
  border: none; color: #fff; padding: 11px; border-radius: 8px; font-size: 15px;
  font-weight: 600; cursor: pointer; }
button.primary:hover { background: var(--accent2); }
button.primary:disabled { opacity: .5; cursor: not-allowed; }
.progress-wrap { margin-top: 16px; display: none; }
.progress { height: 8px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0;
  transition: width .3s; }
.progress-text { font-size: 12px; color: var(--muted); margin-top: 6px;
  display: flex; justify-content: space-between; }
.status-error { color: var(--red); font-size: 12px; margin-top: 8px;
  word-break: break-all; }
.result { grid-column: 1 / -1; display: none; }
.result-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 14px; }
.result-head h2 { margin: 0; }
.btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.green { background: var(--green); border-color: var(--green); color: #06210f; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 6px 12px; border-radius: 6px; background: var(--panel2);
  border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-size: 13px; }
.tab.active { color: var(--text); border-color: var(--accent); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px; max-height: 460px; overflow-y: auto; padding: 4px; }
.gallery img { width: 100%; border-radius: 6px; border: 1px solid var(--border);
  cursor: pointer; background: #000; }
.controls { display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  flex-wrap: wrap; }
.stage { position: relative; width: 100%; max-width: 720px; aspect-ratio: 16/9;
  background: #000; border-radius: 8px; overflow: hidden; display: none; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; }
.stage .top { clip-path: inset(0 50% 0 0); }
.stage input[type=range] { position: absolute; bottom: 8px; left: 8%; width: 84%;
  z-index: 3; accent-color: var(--accent); }
.compare-label { position: absolute; top: 8px; font-size: 11px; padding: 2px 8px;
  background: rgba(0,0,0,.6); border-radius: 4px; z-index: 2; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>视频帧序列导出</h1>
  <span class="tag">video-frame-exporter v2.0</span>
</header>
<main>
  <section class="card">
    <h2>1. 上传视频</h2>
    <div class="drop" id="drop">
      拖拽视频到这里，或点击选择文件
      <div class="file-name" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept="video/*" hidden>
  </section>

  <section class="card">
    <h2>2. 参数设置</h2>
    <label class="field"><span>预设模板</span>
      <select id="preset">
        <option value="">自定义（默认全功能）</option>
        <option value="anime">动漫风</option>
        <option value="realistic">写实风</option>
        <option value="sketch_only">纯线稿</option>
        <option value="fast">极速模式</option>
      </select>
    </label>
    <div class="grid2">
      <label class="field"><span>帧率 fps</span>
        <input type="number" id="fps" value="24" min="1" max="60" step="1"></label>
      <label class="field"><span>线稿底色</span>
        <select id="lineart_bg">
          <option value="transparent">透明底</option>
          <option value="white">白底</option>
          <option value="both">两者都要</option>
        </select>
      </label>
      <label class="field"><span>Canny 低阈值</span>
        <input type="number" id="canny_low" value="50"></label>
      <label class="field"><span>Canny 高阈值</span>
        <input type="number" id="canny_high" value="150"></label>
      <label class="field"><span>线宽</span>
        <input type="number" id="line_width" value="1" min="1" max="8"></label>
      <label class="field"><span>碎点过滤</span>
        <input type="number" id="min_component" value="30" min="1"></label>
      <label class="field"><span>关键帧阈值</span>
        <input type="number" id="keyframe_threshold" value="18" min="0" max="64"></label>
      <label class="field"><span>蒙版阈值</span>
        <input type="number" id="mask_threshold" value="127" min="0" max="255"></label>
      <label class="field"><span>底色层级</span>
        <input type="number" id="color_levels" value="6" min="2" max="16"></label>
      <label class="field"><span>并行进程数</span>
        <input type="number" id="workers" value="1" min="1" max="32"></label>
    </div>
    <h2 style="margin-top:14px">功能开关</h2>
    <div class="toggles" id="toggles">
      <label class="toggle on"><input type="checkbox" data-key="depth" checked>深度图</label>
      <label class="toggle on"><input type="checkbox" data-key="segment" checked>主体蒙版</label>
      <label class="toggle on"><input type="checkbox" data-key="cutout" checked>透明抠图</label>
      <label class="toggle on"><input type="checkbox" data-key="keyframes" checked>关键帧</label>
      <label class="toggle on"><input type="checkbox" data-key="stabilize" checked>时域稳定</label>
      <label class="toggle on"><input type="checkbox" data-key="base_color" checked>自动底色</label>
      <label class="toggle on"><input type="checkbox" data-key="palette" checked>主色卡</label>
      <label class="toggle on"><input type="checkbox" data-key="contact_sheet" checked>接触表</label>
      <label class="toggle on"><input type="checkbox" data-key="gif" checked>GIF</label>
      <label class="toggle on"><input type="checkbox" data-key="prores" checked>ProRes</label>
      <label class="toggle"><input type="checkbox" data-key="trial">参数试跑（前10帧）</label>
    </div>
    <button class="primary" id="submitBtn" disabled>开始导出</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress"><div id="progressBar"></div></div>
      <div class="progress-text">
        <span id="phaseText">准备中...</span>
        <span id="frameText">0 / 0</span>
      </div>
    </div>
    <div class="status-error" id="errorText"></div>
  </section>

  <section class="card result" id="result">
    <div class="result-head">
      <h2>处理结果</h2>
      <button class="btn green" id="downloadBtn">下载 zip</button>
      <button class="btn" id="playBtn">帧序列播放</button>
      <button class="btn" id="compareBtn">对比滑块</button>
    </div>
    <div class="controls">
      <button class="btn" id="playPause">暂停</button>
      <label class="field" style="margin:0;min-width:120px"><span>播放帧率</span>
        <input type="number" id="playFps" value="24" min="1" max="60" style="width:100px"></label>
    </div>
    <div class="stage" id="stage">
      <img class="bottom" id="stageBottom" alt="">
      <img class="top" id="stageTop" alt="">
      <span class="compare-label" style="left:8px" id="labelTop">线稿</span>
      <span class="compare-label" style="right:8px" id="labelBottom">原图</span>
      <input type="range" id="compareRange" min="0" max="100" value="50">
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="gallery" id="gallery"></div>
    <div class="empty" id="emptyTip">该目录暂无文件</div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
